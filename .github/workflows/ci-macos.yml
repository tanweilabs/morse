name: CI macOS

# The suite on macOS, once a week and whenever someone starts it by hand — never per push:
# a macOS runner minute is billed 10x (ADR-015, CLAUDE.md rule 7). What it is there to catch
# is what only shows up on a Mac: path handling, and better-sqlite3 building or loading its
# native module. Cost: one run a week.

on:
  schedule:
    - cron: '0 3 * * 1' # every Monday, 03:00 UTC
  workflow_dispatch:

concurrency:
  group: ci-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node 22 / macos
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Node 22, with the npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install from the lockfile
        run: npm ci
      - name: Build (tsc)
        run: npm run build
      - name: Test (vitest)
        run: npm test
